schema: spec-driven

context: |
  Project: SuccinctCoin - a minimalistic cryptocurrency built as an Electron desktop app.
  
  Tech stack:
     - Electron 36 + Electron Forge 7.x for desktop packaging
     - React 19 with hooks for renderer UI
     - Express.js API server in main process (port 3001 dev / 3333 prod)
     - Webpack 12 (separate main/renderer configs)
     - Jest 30 for testing (node environment)
     - ESLint 9 with flat config
     - libp2p 3.x with TCP, FloodSub pubsub, mDNS peer discovery
     - dayjs for date/time handling (moment.js removed)
     - Node.js crypto (ECDSA prime256v1, SHA512)
     - big.js for arbitrary-precision arithmetic
     - obj2fs-hoc for persistence to ~/.succinctcoin/
     - contextIsolation: true for security
  
  Architecture:
     - src/main/ — Electron main process (blockchain, wallet, networking, API)
